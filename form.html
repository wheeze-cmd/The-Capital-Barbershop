<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="css/style.css" rel ="stylesheet">
<link href="css/button.css" rel ="stylesheet">
<link href="css/breakpoint.css" rel="stylesheet">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>The Capital Barbershop</title>
</head>
<body>
    <header id="navbar">
        <div class="logo">
            <img src="images/logo_dark2.png" alt="The Capital Barbershop Logo">
        </div>
        
        <input type="checkbox" id="burger">
        <label for="burger" class="burger"><img src="images/svg/comb.svg"></label>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html #about">About</a>
            <a href="index.html #services">Services</a>
            <a href="index.html #gallery">Gallery</a>
            <a href="index.html #contact">Contact</a>    
        </nav>

        <a class="button" id="appointmentbtn_desktop" href="form.html">
            Book Appointment
            <img src="images/svg/right_arrow.svg">
        </a>
    </header>
    
    <main>
        <section class="appointment" id="appointment">
            <header class="section-header">
                <div class="section-title">
                    <h6>THE CAPITAL</h6>
                    <h2>APPOINTMENT</h2>
                </div>
                <div class="gradient-line"></div>
                <h4>One step closer to greatness.</h4>
            </header>

<form class="contact-form" id="appointmentForm">

    <div class="input">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input 
                type="text"
                id="name"
                placeholder="Your name"
                class="input-field"
                required
            >
        </div>

        <div class="form-group">
            <label for="contact">Contact Number</label>
            <input 
                type="tel"
                id="contact"
                placeholder="+63 912 345 6789"
                class="input-field"
                required
            >
        </div>

    </div>

    <div class="input">

        <div class="form-group">
            <label for="service">Service</label>

            <select 
                id="service"
                class="input-field"
                required
            >
                <option value="">Select a service</option>
                <option value="Haircut">Haircut</option>
                <option value="Beard Shave">Beard Shave</option>
                <option value="Combo">Combo</option>
            </select>
        </div>

        <div class="form-group">
            <label for="preferred_time">Preferred Date & Time</label>

        <input
            type="datetime-local"
            id="preferred_time"
            class="input-field"
            required
        >
        </div>

    </div>

    <div class="form-group message-group">
        <label for="note">Notes</label>

        <textarea
            id="note"
            placeholder="Special requests or preferred style..."
            class="message-field"
        ></textarea>
    </div>

    <button type="submit" class="button" id="primary_button">
        Book
        <img src="images/svg/right_arrow.svg">
    </button>

</form>

        </section>
    </main>
    <footer>
        <div class="top-footer">
            <img src="images/favicon.png">
            <p>The Capital Barbershop is more than a cut. It's a lifestyle. Walk in sharp. Walk out sharper.</p>
        </div>
        <div class="bottom-footer"><p>©2026 The Capital. Developers: Louis Miguel Terrago & Cyrus Felix. All rights reserved.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/appointment.js"></script>
</body>
</html>
