<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="css/style.css" rel ="stylesheet">
<link href="css/button.css" rel ="stylesheet">
<link href="css/breakpoint.css" rel="stylesheet">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>The Capital Barbershop</title>
</head>
<body>
    <header id="navbar">
        <a class="logo">
            <img src="images/logo_dark2.png" alt="The Capital Barbershop Logo">
        </a>
        
        <input type="checkbox" id="burger">
        <label for="burger" class="burger"><img src="images/svg/comb.svg"></label>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#gallery">Gallery</a>
            <a href="index.html#contact">Contact</a>    
        </nav>

        <a class="button" id="appointmentbtn_desktop" href="form.html">
            Book Appointment
            <img src="images/svg/right_arrow.svg">
        </a>
    </header>
    
    <main>
        <section class="appointment" id="appointment">
            <header class="section-header">
                <div class="section-title">
                    <h6>THE CAPITAL</h6>
                    <h2>APPOINTMENT</h2>
                </div>
                <div class="gradient-line"></div>
                <h4>One step closer to greatness.</h4>
            </header>

<form class="contact-form" id="appointmentForm">

    <div class="input">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input 
                type="text"
                id="name"
                class="input-field"
                placeholder="Your name"
                pattern="[A-Za-z\s]+"
                title="Name should contain letters only"
                required
            >
        </div>

        <div class="form-group">
            <label for="contact">Contact Number</label>
            <input 
                type="tel"
                id="contact"
                class="input-field"
                placeholder="09XXXXXXXXX"
                pattern="[0-9]{11}"
                maxlength="11"
                title="Please enter exactly 11 digits"
                required
            >
        </div>

    </div>

    <div class="input">

        <div class="form-group">
            <label for="service">Service</label>

            <select 
                id="service"
                class="input-field"
                required
            >
                <option value="">Select a service</option>
                <option value="Haircut">Haircut</option>
                <option value="Beard Shave">Beard Shave</option>
                <option value="Combo">Combo</option>
            </select>
        </div>
    <div class="form-group">
        <label for="appointment_date">Date</label>

        <input
            type="date"
            id="appointment_date"
            class="input-field"
            required
        >
    </div>

    <div class="form-group">
        <label for="appointment_time">Time</label>

            <select
                id="appointment_time"
                class="input-field"
                required
            >
            <option value="">Select Time</option>

            <option value="12:00">12:00 PM</option>
            <option value="12:30">12:30 PM</option>

            <option value="13:00">1:00 PM</option>
            <option value="13:30">1:30 PM</option>

            <option value="14:00">2:00 PM</option>
            <option value="14:30">2:30 PM</option>

            <option value="15:00">3:00 PM</option>
            <option value="15:30">3:30 PM</option>

            <option value="16:00">4:00 PM</option>
            <option value="16:30">4:30 PM</option>

            <option value="17:00">5:00 PM</option>
            <option value="17:30">5:30 PM</option>

            <option value="18:00">6:00 PM</option>
            <option value="18:30">6:30 PM</option>
        </select>
    </div>

    </div>

    <div class="form-group message-group">
        <label for="note">Notes</label>

        <textarea
            id="note"
            placeholder="Special requests or preferred style..."
            class="message-field"
        ></textarea>
    </div>

    <button type="submit" class="button" id="primary_button">
        Book
        <img src="images/svg/right_arrow.svg">
    </button>

</form>

        </section>
    </main>
    <footer>
        <div class="top-footer">
            <img src="images/favicon.png">
            <p>The Capital Barbershop is more than a cut. It's a lifestyle. Walk in sharp. Walk out sharper.</p>
        </div>
        <div class="bottom-footer"><p>©2026 The Capital. Developers: Louis Miguel Terrago & Cyrus Felix. All rights reserved.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/appointment.js"></script>
</body>
</html>
